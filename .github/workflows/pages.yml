name: Build and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rebuild daily so the "current week" highlight stays accurate and any edits
# to the attendance Google Sheet propagate without a push. 03:00 UTC = 08:30 IST.
# (Use the Actions tab -> Run workflow for an instant refresh.)
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate index.html from plan.json
        run: python _dashboard/build.py

      # enablement: turns the Pages site on via the API on the first run,
      # so there is no manual step in repo Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
